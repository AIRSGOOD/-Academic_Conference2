<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>급식 플랫폼</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Noto Sans KR',sans-serif;
      background:linear-gradient(135deg,#0099cc 0%,#005f8a 100%);
      min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    body::before,body::after{content:'';position:fixed;border-radius:50%;opacity:.15;pointer-events:none;}
    body::before{width:400px;height:400px;background:white;top:-100px;left:-100px;}
    body::after{width:500px;height:500px;background:white;bottom:-150px;right:-150px;}
    .card{
      background:rgba(255,255,255,.13);backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,.3);border-radius:28px;
      padding:52px 48px;text-align:center;width:360px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);animation:fadeUp .6s ease both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    .emoji{font-size:52px;margin-bottom:12px;display:block;}
    h1{color:white;font-size:28px;font-weight:900;margin-bottom:6px;}
    .subtitle{color:rgba(255,255,255,.75);font-size:13px;margin-bottom:40px;}
    .btn-group{display:flex;flex-direction:column;gap:14px;}
    .btn{
      display:block;width:100%;padding:17px;border:none;border-radius:14px;
      font-family:'Noto Sans KR',sans-serif;font-size:17px;font-weight:700;
      cursor:pointer;text-decoration:none;
      transition:transform .18s,box-shadow .18s,background .18s;letter-spacing:2px;
    }
    .btn-teacher{background:white;color:#0099cc;box-shadow:0 4px 20px rgba(0,0,0,.15);}
    .btn-teacher:hover{background:#0099cc;color:white;transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,153,204,.45);}
    .btn-student{background:rgba(255,255,255,.2);color:white;border:2px solid rgba(255,255,255,.5);}
    .btn-student:hover{background:white;color:#3db8d8;border-color:white;transform:translateY(-2px);box-shadow:0 8px 28px rgba(125,211,232,.45);}
  </style>
</head>
<body>
  <div class="card">
    <span class="emoji">🍱</span>
    <h1>급식 플랫폼</h1>
    <p class="subtitle">사용자 유형을 선택하세요</p>
    <div class="btn-group">
      <a href="teacher-login.html" class="btn btn-teacher">교사용</a>
      <a href="student-login.html" class="btn btn-student">학생용</a>
    </div>
  </div>
</body>
</html>
