<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>오늘의 급식 - 급식 플랫폼</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--blue:#0099cc;--sb:80px;--sb-ex:220px;--bg:#eef4f8;--card:#fff;--text:#1e2a38;--muted:#7a8fa0;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;display:flex;}

    /* 사이드바 */
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:#1b2b3a;display:flex;flex-direction:column;z-index:200;transition:width .26s cubic-bezier(.4,0,.2,1);overflow:hidden;box-shadow:2px 0 16px rgba(0,0,0,.18);}
    .sidebar:hover{width:var(--sb-ex);}
    .sb-top{padding:18px 0 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;}
    .hamburger{display:flex;flex-direction:column;gap:5px;}
    .hamburger span{display:block;width:26px;height:2.5px;background:rgba(255,255,255,.45);border-radius:2px;}
    .sb-all{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px;white-space:nowrap;}
    .nav{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:6px 0;}
    .nav-item{position:relative;cursor:pointer;}
    .nav-main{display:flex;align-items:center;padding:13px 0;gap:14px;transition:background .18s;position:relative;white-space:nowrap;}
    .nav-main::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;border-radius:0 2px 2px 0;}
    .nav-item.active .nav-main::before{background:var(--blue);}
    .nav-item:hover .nav-main,.nav-item.active .nav-main{background:rgba(255,255,255,.06);}
    .nav-icon-wrap{width:var(--sb);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .nav-icon{font-size:22px;line-height:1;}
    .nav-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);white-space:nowrap;transition:color .18s;}
    .nav-item.active .nav-label,.nav-item:hover .nav-label{color:rgba(255,255,255,.95);}
    .nav-sub{max-height:0;overflow:hidden;transition:max-height .22s ease;background:rgba(0,0,0,.15);}
    .sidebar:hover .nav-item:hover .nav-sub{max-height:200px;}
    .nav-sub a{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 36px;font-size:13px;color:rgba(255,255,255,.5);text-decoration:none;white-space:nowrap;transition:background .14s,color .14s;}
    .nav-sub a:hover{background:rgba(255,255,255,.07);color:#fff;}
    .sub-icon{font-size:14px;width:18px;text-align:center;}
    .sb-bottom{border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;}
    .logout-row{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;transition:background .15s;white-space:nowrap;}
    .logout-row:hover{background:rgba(255,60,60,.1);}

    /* 메인 */
    .main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;min-height:100vh;}

    .meal-header{background:linear-gradient(135deg,#0099cc 0%,#005f8a 100%);padding:28px 32px 36px;position:relative;overflow:hidden;}
    .meal-header::before{content:'';position:absolute;width:200px;height:200px;background:rgba(255,255,255,.08);border-radius:50%;top:-60px;right:-40px;}
    .meal-header::after{content:'';position:absolute;width:140px;height:140px;background:rgba(255,255,255,.05);border-radius:50%;bottom:-40px;left:60px;}
    .meal-header-inner{max-width:700px;width:100%;margin:0 auto;position:relative;z-index:1;}
    .school-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 14px;font-size:12px;color:white;margin-bottom:12px;cursor:pointer;transition:background .15s;}
    .school-badge:hover{background:rgba(255,255,255,.3);}
    .meal-title{font-size:24px;font-weight:900;color:white;margin-bottom:4px;}
    .meal-date-info{font-size:13px;color:rgba(255,255,255,.8);}
    .date-nav{background:var(--card);padding:14px 32px;border-bottom:1px solid #dde8f0;box-shadow:0 1px 8px rgba(0,60,120,.05);}
    .date-nav-inner{max-width:700px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px;}
    .date-btn{width:36px;height:36px;border:1.5px solid #d0e8f5;border-radius:10px;background:white;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
    .date-btn:hover{background:#e8f7ff;border-color:var(--blue);}
    .date-display{flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--text);}
    .today-btn{padding:8px 16px;background:var(--blue);color:white;border:none;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;}
    .today-btn:hover{opacity:.85;}
    .content{padding:24px 32px;flex:1;max-width:700px;width:100%;margin:0 auto;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    /* 급식 카드 */
    .meal-card{background:var(--card);border-radius:18px;box-shadow:0 2px 16px rgba(0,60,120,.08);overflow:hidden;animation:fadeUp .4s ease both;}
    .meal-card-head{padding:20px 24px;border-bottom:1px solid #eef3f8;display:flex;align-items:center;justify-content:space-between;}
    .meal-type-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue);}
    .kcal-info{font-size:13px;color:var(--muted);}
    .kcal-num{font-size:15px;font-weight:700;color:var(--text);}

    /* 메뉴 리스트 */
    .menu-list{padding:20px 24px;display:flex;flex-direction:column;gap:8px;}
    .menu-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#f6fbff;border-radius:12px;font-size:14px;color:var(--text);animation:fadeUp .3s ease both;}
    .menu-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0;}
    .menu-name{flex:1;}
    .menu-allergy{font-size:10px;color:var(--muted);background:#eef3f8;padding:2px 7px;border-radius:6px;}

    /* 원산지 */
    .origin-section{padding:16px 24px;border-top:1px solid #eef3f8;background:#fafcfe;}
    .origin-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:8px;}
    .origin-text{font-size:12px;color:#8fa4b8;line-height:1.7;}

    /* 빈 상태 */
    .empty-state{text-align:center;padding:60px 20px;color:var(--muted);animation:fadeUp .4s ease both;}
    .empty-icon{font-size:56px;margin-bottom:16px;}
    .empty-title{font-size:16px;font-weight:700;margin-bottom:6px;}
    .empty-sub{font-size:13px;}
    .go-select-btn{display:inline-block;margin-top:18px;padding:12px 24px;background:linear-gradient(90deg,#0099cc,#005f8a);color:white;border-radius:12px;text-decoration:none;font-size:14px;font-weight:700;transition:transform .15s;}
    .go-select-btn:hover{transform:translateY(-2px);}
    .spinner{text-align:center;padding:50px;color:var(--muted);font-size:14px;}

    /* 급식 없는 날 */
    .no-meal{text-align:center;padding:48px 20px;color:var(--muted);animation:fadeUp .4s ease both;}
    .no-meal .no-icon{font-size:48px;margin-bottom:12px;}
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="sb-top"><div class="hamburger"><span></span><span></span><span></span></div><span class="sb-all">전체</span></div>
  <div class="nav">
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏠</span></div><span class="nav-label">홈</span></div><div class="nav-sub"><a href="main.html"><span class="sub-icon">📋</span>게시판</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🗳️</span></div><span class="nav-label">급식투표</span></div><div class="nav-sub"><a href="#"><span class="sub-icon">✅</span>투표하기</a></div></div>
    <div class="nav-item active"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🍱</span></div><span class="nav-label">오늘의급식</span></div><div class="nav-sub"><a href="meal.html"><span class="sub-icon">📅</span>오늘 메뉴</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">✏️</span></div><span class="nav-label">글쓰기</span></div><div class="nav-sub"><a href="write.html"><span class="sub-icon">📝</span>새 글 작성</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏫</span></div><span class="nav-label">학교선택</span></div><div class="nav-sub"><a href="school-select.html"><span class="sub-icon">🔍</span>학교 검색</a></div></div>
  </div>
  <div class="sb-bottom"><div class="logout-row" id="logoutBtn"><div class="nav-icon-wrap"><span class="nav-icon">🚪</span></div><span class="nav-label" style="color:rgba(255,100,100,.75);">로그아웃</span></div></div>
</nav>

<div class="main">
  <div class="meal-header">
    <div class="meal-header-inner">
      <div class="school-badge" onclick="location.href='school-select.html'">
        🏫 <span id="schoolName">학교를 선택해주세요</span> ›
      </div>
      <div class="meal-title">🍱 오늘의 급식</div>
      <div class="meal-date-info" id="headerDate"></div>
    </div>
  </div>

  <!-- 날짜 네비 -->
  <div class="date-nav">
    <div class="date-nav-inner">
      <button class="date-btn" onclick="changeDate(-1)">‹</button>
      <div class="date-display" id="dateDisplay"></div>
      <button class="date-btn" onclick="changeDate(1)">›</button>
      <button class="today-btn" onclick="goToday()">오늘</button>
    </div>
  </div>

  <!-- 콘텐츠 -->
  <div class="content">
    <div id="mealContent"><div class="spinner">🍱 급식 정보 불러오는 중...</div></div>
  </div>
</div>

<script type="module">
  import DB from './db.js';
  const user = DB.getSession();
  if (!user) location.href = 'index.html';
  document.getElementById('logoutBtn').onclick = () => { DB.clearSession(); location.href='index.html'; };

  const NEIS_KEY = 'c76fc2e4519c49f0ba146bcabea9ddc9';

  // 날짜 관리
  let currentDate = new Date();
  const days = ['일','월','화','수','목','금','토'];

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}${m}${day}`;
  }
  function formatDisplay(d) {
    return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  }

  function updateDateUI() {
    document.getElementById('dateDisplay').textContent = formatDisplay(currentDate);
    document.getElementById('headerDate').textContent = formatDisplay(currentDate);
  }

  window.changeDate = function(delta) {
    currentDate.setDate(currentDate.getDate() + delta);
    updateDateUI();
    loadMeal();
  };
  window.goToday = function() {
    currentDate = new Date();
    updateDateUI();
    loadMeal();
  };

  // 음식별 이모지
  const emojiMap = [
    ['밥','🍚'],['국','🍲'],['찌개','🍲'],['죽','🥣'],['면','🍜'],['파스타','🍝'],
    ['피자','🍕'],['햄버거','🍔'],['치킨','🍗'],['돈까스','🍛'],['생선','🐟'],['고등어','🐟'],
    ['삼치','🐟'],['갈비','🥩'],['불고기','🥩'],['김치','🥬'],['샐러드','🥗'],['나물','🥦'],
    ['두부','⬜'],['계란','🥚'],['달걀','🥚'],['우유','🥛'],['요구르트','🥛'],['과일','🍎'],
    ['김','🟫'],['빵','🍞'],['떡','🍡'],['만두','🥟'],['튀김','🍤'],['소시지','🌭'],
    ['스파게티','🍝'],['볶음','🍳'],['조림','🫕'],['구이','🔥'],['찜','🫕'],
  ];
  function getEmoji(name) {
    for (const [k, e] of emojiMap) {
      if (name.includes(k)) return e;
    }
    return '🍽️';
  }

  // 알레르기 코드
  const allergyMap = {
    '1':'난류','2':'우유','3':'메밀','4':'땅콩','5':'대두','6':'밀',
    '7':'고등어','8':'게','9':'새우','10':'돼지고기','11':'복숭아',
    '12':'토마토','13':'아황산류','14':'호두','15':'닭고기','16':'쇠고기',
    '17':'오징어','18':'조개류','19':'잣'
  };

  async function loadMeal() {
    const schoolData = localStorage.getItem('selected_school');
    if (!schoolData) {
      document.getElementById('mealContent').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🏫</div>
          <div class="empty-title">학교를 선택해주세요</div>
          <div class="empty-sub">학교를 선택하면 실제 급식 정보를 볼 수 있어요</div>
          <a href="school-select.html" class="go-select-btn">학교 선택하러 가기</a>
        </div>`;
      return;
    }

    const school = JSON.parse(schoolData);
    document.getElementById('schoolName').textContent = school.SCHUL_NM;

    // 교육청 코드 → ATPT_OFCDC_SC_CODE
    const officeCode = school.ATPT_OFCDC_SC_CODE;
    const schoolCode = school.SD_SCHUL_CODE;
    const dateStr = formatDate(currentDate);

    document.getElementById('mealContent').innerHTML = '<div class="spinner">🍱 급식 불러오는 중...</div>';

    try {
      const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${NEIS_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${officeCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${dateStr}`;
      const res = await fetch(url);
      const data = await res.json();
      const meals = data?.mealServiceDietInfo?.[1]?.row;

      if (!meals || meals.length === 0) {
        document.getElementById('mealContent').innerHTML = `
          <div class="no-meal">
            <div class="no-icon">😴</div>
            <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;">급식 정보가 없어요</div>
            <div style="font-size:13px;">방학이거나 급식이 없는 날이에요</div>
          </div>`;
        return;
      }

      document.getElementById('mealContent').innerHTML = meals.map((meal, mi) => {
        // 메뉴 파싱 (줄바꿈으로 구분, 알레르기 번호 제거)
        const menuItems = (meal.DDISH_NM || '')
          .replace(/<br\/>/g, '\n')
          .split('\n')
          .map(item => item.trim())
          .filter(Boolean);

        // 원산지
        const origin = (meal.ORPLC_INFO || '').replace(/<br\/>/g, ' ');
        const kcal = meal.CAL_INFO || '';
        const mealType = meal.MMEAL_SC_NM || '';

        const menuHTML = menuItems.map((item, i) => {
          // 알레르기 번호 추출
          const allergyMatch = item.match(/\(([0-9.,]+)\)/);
          const allergyNums = allergyMatch ? allergyMatch[1].split('.').filter(Boolean) : [];
          const allergyNames = allergyNums.map(n => allergyMap[n]).filter(Boolean);
          const cleanName = item.replace(/\([0-9.,]+\)/g, '').trim();
          const emoji = getEmoji(cleanName);

          return `<div class="menu-item" style="animation-delay:${(mi*10+i)*0.04}s">
            <span class="menu-icon">${emoji}</span>
            <span class="menu-name">${cleanName}</span>
            ${allergyNames.length ? `<span class="menu-allergy">${allergyNames.join(', ')}</span>` : ''}
          </div>`;
        }).join('');

        return `<div class="meal-card" style="margin-bottom:16px;animation-delay:${mi*0.08}s">
          <div class="meal-card-head">
            <div class="meal-type-badge">🍽️ ${mealType}</div>
            <div class="kcal-info">열량 <span class="kcal-num">${kcal}</span></div>
          </div>
          <div class="menu-list">${menuHTML}</div>
          ${origin ? `<div class="origin-section">
            <div class="origin-title">원산지</div>
            <div class="origin-text">${origin}</div>
          </div>` : ''}
        </div>`;
      }).join('');

    } catch(e) {
      document.getElementById('mealContent').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <div class="empty-title">불러오기 실패</div>
          <div class="empty-sub">네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.</div>
        </div>`;
    }
  }

  updateDateUI();
  loadMeal();
</script>
</body>
</html>
