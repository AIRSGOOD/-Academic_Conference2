<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>게시글 - 급식 플랫폼</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--blue:#0099cc;--sb:80px;--sb-ex:220px;--bg:#eef4f8;--card:#fff;--text:#1e2a38;--muted:#7a8fa0;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;display:flex;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:#1b2b3a;display:flex;flex-direction:column;z-index:200;transition:width .26s cubic-bezier(.4,0,.2,1);overflow:hidden;box-shadow:2px 0 16px rgba(0,0,0,.18);}
    .sidebar:hover{width:var(--sb-ex);}
    .sb-top{padding:18px 0 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;}
    .hamburger{display:flex;flex-direction:column;gap:5px;}
    .hamburger span{display:block;width:26px;height:2.5px;background:rgba(255,255,255,.45);border-radius:2px;}
    .sb-all{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px;white-space:nowrap;}
    .nav{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:6px 0;}
    .nav-item{position:relative;cursor:pointer;}
    .nav-main{display:flex;align-items:center;padding:13px 0;gap:14px;transition:background .18s;position:relative;white-space:nowrap;}
    .nav-main::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;border-radius:0 2px 2px 0;}
    .nav-item.active .nav-main::before{background:var(--blue);}
    .nav-item:hover .nav-main,.nav-item.active .nav-main{background:rgba(255,255,255,.06);}
    .nav-icon-wrap{width:var(--sb);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .nav-icon{font-size:22px;}
    .nav-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);white-space:nowrap;transition:color .18s;}
    .nav-item.active .nav-label,.nav-item:hover .nav-label{color:rgba(255,255,255,.95);}
    .nav-sub{max-height:0;overflow:hidden;transition:max-height .22s ease;background:rgba(0,0,0,.15);}
    .sidebar:hover .nav-item:hover .nav-sub{max-height:200px;}
    .nav-sub a{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 36px;font-size:13px;color:rgba(255,255,255,.5);text-decoration:none;white-space:nowrap;transition:background .14s,color .14s;}
    .nav-sub a:hover{background:rgba(255,255,255,.07);color:#fff;}
    .sub-icon{font-size:14px;width:18px;text-align:center;}
    .sb-bottom{border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;}
    .logout-row{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;transition:background .15s;white-space:nowrap;}
    .logout-row:hover{background:rgba(255,60,60,.1);}
    .main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;}
    .page-header{background:var(--card);padding:16px 28px;border-bottom:1px solid #dde8f0;box-shadow:0 1px 8px rgba(0,60,120,.05);}
    .page-header-inner{max-width:820px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;}
    .back-btn{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:14px;font-weight:700;text-decoration:none;padding:7px 14px;border-radius:10px;border:1.5px solid #d0e8f5;background:white;cursor:pointer;transition:background .15s;}
    .back-btn:hover{background:#e8f7ff;}
    .content{padding:28px 32px;flex:1;max-width:820px;width:100%;margin:0 auto;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .post-card{background:var(--card);border-radius:18px;box-shadow:0 2px 16px rgba(0,60,120,.08);overflow:hidden;margin-bottom:20px;animation:fadeUp .4s ease both;}
    .post-head{padding:24px 26px 18px;border-bottom:1px solid #eef3f8;}
    .post-title-txt{font-size:20px;font-weight:900;color:var(--text);margin-bottom:12px;line-height:1.4;}
    .post-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
    .post-author-name{font-weight:700;color:var(--blue);}
    .delete-btn{margin-left:auto;padding:5px 12px;border:1.5px solid #ffcccc;border-radius:8px;background:white;color:#e53935;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
    .delete-btn:hover{background:#fff0f0;}
    .post-image{width:100%;max-height:420px;object-fit:cover;display:block;}
    .post-body-text{padding:24px 26px;font-size:15px;color:var(--text);line-height:1.8;white-space:pre-wrap;}
    .comment-section{background:var(--card);border-radius:18px;box-shadow:0 2px 16px rgba(0,60,120,.08);overflow:hidden;animation:fadeUp .4s ease both .1s;}
    .comment-header{padding:18px 24px;border-bottom:1px solid #eef3f8;font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
    .comment-count{background:#e8f7ff;color:var(--blue);font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;}
    .comment-list{display:flex;flex-direction:column;}
    .comment-item{padding:16px 24px;border-bottom:1px solid #f3f7fb;display:flex;gap:12px;align-items:flex-start;}
    .comment-item:last-child{border-bottom:none;}
    .comment-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7dd3e8,#0099cc);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;color:white;font-weight:700;}
    .comment-body{flex:1;}
    .comment-author{font-size:13px;font-weight:700;color:var(--text);}
    .comment-role{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px;}
    .role-t{background:#e3f2fd;color:#0077aa;}
    .role-s{background:#e0f7fa;color:#00838f;}
    .comment-text{font-size:14px;color:#334;margin-top:5px;line-height:1.6;}
    .comment-time{font-size:11px;color:#b0bec5;margin-top:4px;}
    .comment-del{margin-left:auto;font-size:11px;color:#f88;cursor:pointer;padding:2px 6px;border-radius:5px;border:none;background:none;font-family:'Noto Sans KR',sans-serif;}
    .comment-del:hover{background:#fff0f0;}
    .comment-input-area{padding:16px 24px;background:#f8fbff;border-top:1px solid #eef3f8;display:flex;gap:12px;align-items:flex-end;}
    .input-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0099cc,#005f8a);display:flex;align-items:center;justify-content:center;font-size:14px;color:white;font-weight:700;flex-shrink:0;}
    .comment-box{flex:1;}
    .comment-textarea{width:100%;border:1.5px solid #d0e0ec;border-radius:12px;padding:11px 14px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);resize:none;outline:none;min-height:52px;background:white;transition:border-color .18s;}
    .comment-textarea:focus{border-color:var(--blue);}
    .comment-textarea::placeholder{color:#c5d5df;}
    .submit-comment{padding:11px 20px;background:linear-gradient(90deg,#0099cc,#005f8a);color:white;border:none;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(0,153,204,.3);transition:transform .15s;white-space:nowrap;}
    .submit-comment:hover{transform:translateY(-1px);}
    .no-comments{padding:28px;text-align:center;color:var(--muted);font-size:14px;}
    .spinner{padding:20px;text-align:center;color:var(--muted);}
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sb-top"><div class="hamburger"><span></span><span></span><span></span></div><span class="sb-all">전체</span></div>
  <div class="nav">
    <div class="nav-item active"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏠</span></div><span class="nav-label">홈</span></div><div class="nav-sub"><a href="main.html"><span class="sub-icon">📋</span>게시판</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🗳️</span></div><span class="nav-label">급식투표</span></div><div class="nav-sub"><a href="#"><span class="sub-icon">✅</span>투표하기</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🍱</span></div><span class="nav-label">오늘의급식</span></div><div class="nav-sub"><a href="#"><span class="sub-icon">📅</span>오늘 메뉴</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">✏️</span></div><span class="nav-label">글쓰기</span></div><div class="nav-sub"><a href="write.html"><span class="sub-icon">📝</span>새 글 작성</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏫</span></div><span class="nav-label">학교선택</span></div><div class="nav-sub"><a href="#"><span class="sub-icon">🔍</span>학교 검색</a></div></div>
  </div>
  <div class="sb-bottom"><div class="logout-row" id="logoutBtn"><div class="nav-icon-wrap"><span class="nav-icon">🚪</span></div><span class="nav-label" style="color:rgba(255,100,100,.75);">로그아웃</span></div></div>
</nav>

<div class="main">
  <div class="page-header">
    <div class="page-header-inner">
      <a href="main.html" class="back-btn">← 목록으로</a>
    </div>
  </div>
  <div class="content">
    <div class="post-card" id="postCard">
      <div class="spinner">⏳ 로딩 중...</div>
    </div>
    <div class="comment-section">
      <div class="comment-header">💬 댓글 <span class="comment-count" id="commentCount">0</span></div>
      <div class="comment-list" id="commentList"><div class="spinner">⏳ 댓글 불러오는 중...</div></div>
      <div class="comment-input-area">
        <div class="input-avatar" id="myAvatar">?</div>
        <div class="comment-box">
          <textarea class="comment-textarea" id="commentInput" placeholder="댓글을 입력하세요... (Enter로 전송, Shift+Enter 줄바꿈)" rows="2"></textarea>
        </div>
        <button class="submit-comment" id="submitCommentBtn">댓글달기</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import DB from './db.js';
  const user = DB.getSession();
  if (!user) location.href = 'index.html';

  document.getElementById('logoutBtn').onclick = () => { DB.clearSession(); location.href='index.html'; };
  document.getElementById('myAvatar').textContent = user.name.charAt(0);

  const params = new URLSearchParams(location.search);
  const postId = params.get('id');
  if (!postId) location.href = 'main.html';

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // 게시글 로드
  DB.getPost(postId).then(post => {
    if (!post) { alert('존재하지 않는 게시글입니다.'); location.href='main.html'; return; }
    const canDelete = user.id === post.authorId || user.role === 'teacher';
    const pinBadge = post.pinned
      ? `<div style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#0077aa;background:#ddf0ff;padding:4px 10px;border-radius:8px;margin-bottom:10px;">📌 교사 공지</div>`
      : '';
    document.getElementById('postCard').innerHTML = `
      <div class="post-head">
        ${pinBadge}
        <div class="post-title-txt">${esc(post.title)}</div>
        <div class="post-meta">
          <span class="post-author-name">✍️ ${esc(post.authorName)}</span>
          <span>·</span>
          <span>${DB.timeAgo(post.createdAt)}</span>
          ${canDelete ? `<button class="delete-btn" id="deleteBtn">🗑 삭제</button>` : ''}
        </div>
      </div>
      ${post.image ? `<img class="post-image" src="${post.image}" alt="이미지"/>` : ''}
      <div class="post-body-text">${esc(post.content)}</div>
    `;
    if (canDelete) {
      document.getElementById('deleteBtn').onclick = async () => {
        if (!confirm('게시글을 삭제할까요?')) return;
        await DB.deletePost(postId);
        location.href = 'main.html';
      };
    }
  });

  // 댓글 실시간 구독
  DB.onComments(postId, comments => {
    document.getElementById('commentCount').textContent = comments.length;
    const list = document.getElementById('commentList');
    if (comments.length === 0) {
      list.innerHTML = '<div class="no-comments">첫 번째 댓글을 남겨보세요! 💬</div>';
      return;
    }
    list.innerHTML = comments.map(c => {
      const canDel = user.id === c.authorId || user.role === 'teacher';
      const roleChip = c.authorRole === 'teacher'
        ? `<span class="comment-role role-t">교사</span>`
        : `<span class="comment-role role-s">학생</span>`;
      return `<div class="comment-item">
        <div class="comment-avatar">${esc(c.authorName.charAt(0))}</div>
        <div class="comment-body">
          <div><span class="comment-author">${esc(c.authorName)}</span>${roleChip}</div>
          <div class="comment-text">${esc(c.content)}</div>
          <div class="comment-time">${DB.timeAgo(c.createdAt)}</div>
        </div>
        ${canDel ? `<button class="comment-del" onclick="window._delComment('${c.id}')">삭제</button>` : ''}
      </div>`;
    }).join('');
  });

  // 댓글 삭제
  window._delComment = async (id) => {
    if (!confirm('댓글을 삭제할까요?')) return;
    await DB.deleteComment(id);
  };

  // 댓글 등록
  async function submitComment() {
    const content = document.getElementById('commentInput').value.trim();
    if (!content) return;
    document.getElementById('submitCommentBtn').disabled = true;
    await DB.addComment({ postId, authorId:user.id, authorName:user.name, authorRole:user.role, content });
    document.getElementById('commentInput').value = '';
    document.getElementById('submitCommentBtn').disabled = false;
  }

  document.getElementById('submitCommentBtn').onclick = submitComment;
  document.getElementById('commentInput').addEventListener('keydown', e => {
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); submitComment(); }
  });
</script>
</body>
</html>
