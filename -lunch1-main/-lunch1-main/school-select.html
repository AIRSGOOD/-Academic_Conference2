<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>학교 선택 - 급식 플랫폼</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--blue:#0099cc;--sb:80px;--sb-ex:220px;--bg:#eef4f8;--card:#fff;--text:#1e2a38;--muted:#7a8fa0;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;display:flex;}

    /* 사이드바 */
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:#1b2b3a;display:flex;flex-direction:column;z-index:200;transition:width .26s cubic-bezier(.4,0,.2,1);overflow:hidden;box-shadow:2px 0 16px rgba(0,0,0,.18);}
    .sidebar:hover{width:var(--sb-ex);}
    .sb-top{padding:18px 0 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;}
    .hamburger{display:flex;flex-direction:column;gap:5px;}
    .hamburger span{display:block;width:26px;height:2.5px;background:rgba(255,255,255,.45);border-radius:2px;}
    .sb-all{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px;white-space:nowrap;}
    .nav{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:6px 0;}
    .nav-item{position:relative;cursor:pointer;}
    .nav-main{display:flex;align-items:center;padding:13px 0;gap:14px;transition:background .18s;position:relative;white-space:nowrap;}
    .nav-main::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;border-radius:0 2px 2px 0;}
    .nav-item.active .nav-main::before{background:var(--blue);}
    .nav-item:hover .nav-main,.nav-item.active .nav-main{background:rgba(255,255,255,.06);}
    .nav-icon-wrap{width:var(--sb);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .nav-icon{font-size:22px;line-height:1;}
    .nav-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);white-space:nowrap;transition:color .18s;}
    .nav-item.active .nav-label,.nav-item:hover .nav-label{color:rgba(255,255,255,.95);}
    .nav-sub{max-height:0;overflow:hidden;transition:max-height .22s ease;background:rgba(0,0,0,.15);}
    .sidebar:hover .nav-item:hover .nav-sub{max-height:200px;}
    .nav-sub a{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 36px;font-size:13px;color:rgba(255,255,255,.5);text-decoration:none;white-space:nowrap;transition:background .14s,color .14s;}
    .nav-sub a:hover{background:rgba(255,255,255,.07);color:#fff;}
    .sub-icon{font-size:14px;width:18px;text-align:center;}
    .sb-bottom{border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;}
    .logout-row{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;transition:background .15s;white-space:nowrap;}
    .logout-row:hover{background:rgba(255,60,60,.1);}

    /* 메인 */
    .main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;min-height:100vh;}
    .page-header{background:var(--card);padding:20px 32px;border-bottom:1px solid #dde8f0;box-shadow:0 1px 8px rgba(0,60,120,.05);}
    .page-header-inner{max-width:640px;width:100%;margin:0 auto;}
    .page-header h1{font-size:20px;font-weight:900;color:var(--text);}
    .page-header p{font-size:13px;color:var(--muted);margin-top:4px;}
    .content{padding:28px 32px;flex:1;max-width:640px;width:100%;margin:0 auto;}

    /* 검색 박스 */
    .search-card{background:var(--card);border-radius:18px;padding:28px;box-shadow:0 2px 16px rgba(0,60,120,.08);margin-bottom:20px;animation:fadeUp .4s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .search-label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;}
    .search-row{display:flex;gap:10px;}
    .search-input{flex:1;padding:13px 16px;border:1.5px solid #d0e8f5;border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color .2s;}
    .search-input:focus{border-color:var(--blue);}
    .search-input::placeholder{color:#b0c4d4;}
    .search-btn{padding:13px 22px;background:linear-gradient(90deg,#0099cc,#005f8a);color:white;border:none;border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .15s;}
    .search-btn:hover{transform:translateY(-1px);}
    .search-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

    /* 현재 선택된 학교 */
    .current-school{background:linear-gradient(90deg,#e8f7ff,#f0fbff);border:1.5px solid #b0dff5;border-radius:14px;padding:16px 20px;margin-bottom:20px;display:none;animation:fadeUp .3s ease both;}
    .current-school .cs-label{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.5px;margin-bottom:4px;}
    .current-school .cs-name{font-size:16px;font-weight:700;color:var(--text);}
    .current-school .cs-addr{font-size:12px;color:var(--muted);margin-top:2px;}

    /* 결과 리스트 */
    .result-list{display:flex;flex-direction:column;gap:10px;}
    .school-item{background:var(--card);border-radius:14px;padding:16px 20px;box-shadow:0 2px 10px rgba(0,60,120,.07);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;border:1.5px solid transparent;display:flex;align-items:center;justify-content:space-between;animation:fadeUp .3s ease both;}
    .school-item:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,100,180,.13);border-color:#b0dff5;}
    .school-item.selected{border-color:var(--blue);background:#f0fbff;}
    .school-info .school-name{font-size:15px;font-weight:700;color:var(--text);}
    .school-info .school-addr{font-size:12px;color:var(--muted);margin-top:3px;}
    .school-info .school-type{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:#e8f7ff;color:var(--blue);margin-top:5px;}
    .select-badge{font-size:12px;font-weight:700;color:var(--blue);padding:6px 14px;border:1.5px solid #b0dff5;border-radius:10px;white-space:nowrap;}
    .school-item.selected .select-badge{background:var(--blue);color:white;border-color:var(--blue);}

    .empty{text-align:center;padding:40px;color:var(--muted);}
    .empty .e-icon{font-size:40px;margin-bottom:10px;}
    .spinner{text-align:center;padding:30px;color:var(--muted);font-size:14px;}
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="sb-top"><div class="hamburger"><span></span><span></span><span></span></div><span class="sb-all">전체</span></div>
  <div class="nav">
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏠</span></div><span class="nav-label">홈</span></div><div class="nav-sub"><a href="main.html"><span class="sub-icon">📋</span>게시판</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🗳️</span></div><span class="nav-label">급식투표</span></div><div class="nav-sub"><a href="#"><span class="sub-icon">✅</span>투표하기</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🍱</span></div><span class="nav-label">오늘의급식</span></div><div class="nav-sub"><a href="meal.html"><span class="sub-icon">📅</span>오늘 메뉴</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">✏️</span></div><span class="nav-label">글쓰기</span></div><div class="nav-sub"><a href="write.html"><span class="sub-icon">📝</span>새 글 작성</a></div></div>
    <div class="nav-item active"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏫</span></div><span class="nav-label">학교선택</span></div><div class="nav-sub"><a href="school-select.html"><span class="sub-icon">🔍</span>학교 검색</a></div></div>
  </div>
  <div class="sb-bottom"><div class="logout-row" id="logoutBtn"><div class="nav-icon-wrap"><span class="nav-icon">🚪</span></div><span class="nav-label" style="color:rgba(255,100,100,.75);">로그아웃</span></div></div>
</nav>

<div class="main">
  <div class="page-header">
    <div class="page-header-inner">
      <h1>🏫 학교 선택</h1>
      <p>학교를 검색해서 선택하면 해당 학교의 급식 정보를 볼 수 있어요</p>
    </div>
  </div>
  <div class="content">

    <!-- 현재 선택 학교 -->
    <div class="current-school" id="currentSchool">
      <div class="cs-label">현재 선택된 학교</div>
      <div class="cs-name" id="csName"></div>
      <div class="cs-addr" id="csAddr"></div>
    </div>

    <!-- 검색 -->
    <div class="search-card">
      <div class="search-label">학교 이름으로 검색</div>
      <div class="search-row">
        <input class="search-input" type="text" id="searchInput" placeholder="예: 서울중학교, 한국고등학교..."/>
        <button class="search-btn" id="searchBtn" onclick="searchSchool()">검색</button>
      </div>
    </div>

    <div id="resultArea"></div>
  </div>
</div>

<script type="module">
  import DB from './db.js';
  const user = DB.getSession();
  if (!user) location.href = 'index.html';
  document.getElementById('logoutBtn').onclick = () => { DB.clearSession(); location.href='index.html'; };

  const NEIS_KEY = 'c76fc2e4519c49f0ba146bcabea9ddc9';

  // 현재 선택된 학교 표시
  const saved = localStorage.getItem('selected_school');
  if (saved) {
    const sc = JSON.parse(saved);
    document.getElementById('currentSchool').style.display = 'block';
    document.getElementById('csName').textContent = sc.SCHUL_NM;
    document.getElementById('csAddr').textContent = sc.ORG_RDNMA;
  }

  window.searchSchool = async function() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    const btn = document.getElementById('searchBtn');
    btn.disabled = true; btn.textContent = '검색 중...';
    document.getElementById('resultArea').innerHTML = '<div class="spinner">🔍 학교 검색 중...</div>';

    try {
      const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${NEIS_KEY}&Type=json&pSize=20&SCHUL_NM=${encodeURIComponent(q)}`;
      const res = await fetch(url);
      const data = await res.json();
      const schools = data?.schoolInfo?.[1]?.row || [];

      if (schools.length === 0) {
        document.getElementById('resultArea').innerHTML = `<div class="empty"><div class="e-icon">🏫</div><p>검색 결과가 없습니다</p></div>`;
      } else {
        renderSchools(schools);
      }
    } catch(e) {
      document.getElementById('resultArea').innerHTML = `<div class="empty"><div class="e-icon">⚠️</div><p>검색 중 오류가 발생했습니다</p></div>`;
    }
    btn.disabled = false; btn.textContent = '검색';
  };

  function renderSchools(schools) {
    const saved = localStorage.getItem('selected_school');
    const selectedCode = saved ? JSON.parse(saved).SD_SCHUL_CODE : null;
    const typeMap = {'초등학교':'초','중학교':'중','고등학교':'고','특수학교':'특'};

    document.getElementById('resultArea').innerHTML = `<div class="result-list">` +
      schools.map((s, i) => {
        const isSel = s.SD_SCHUL_CODE === selectedCode;
        const typeShort = Object.keys(typeMap).find(k => s.SCHUL_KND_SC_NM?.includes(k));
        return `<div class="school-item${isSel?' selected':''}" style="animation-delay:${i*0.04}s" onclick="selectSchool(${i})">
          <div class="school-info">
            <div class="school-name">${s.SCHUL_NM}</div>
            <div class="school-addr">${s.ORG_RDNMA || s.ORG_RDNZC || ''}</div>
            <span class="school-type">${s.SCHUL_KND_SC_NM || ''}</span>
          </div>
          <div class="select-badge">${isSel ? '✓ 선택됨' : '선택'}</div>
        </div>`;
      }).join('') + `</div>`;

    // schools를 window에 저장해서 onclick에서 접근
    window._searchResults = schools;
  }

  window.selectSchool = function(idx) {
    const s = window._searchResults[idx];
    localStorage.setItem('selected_school', JSON.stringify(s));
    // UI 업데이트
    document.getElementById('currentSchool').style.display = 'block';
    document.getElementById('csName').textContent = s.SCHUL_NM;
    document.getElementById('csAddr').textContent = s.ORG_RDNMA || '';
    // 선택 표시 갱신
    document.querySelectorAll('.school-item').forEach((el, i) => {
      el.classList.toggle('selected', i === idx);
      el.querySelector('.select-badge').textContent = i === idx ? '✓ 선택됨' : '선택';
    });
    // 급식 페이지로 이동
    setTimeout(() => location.href = 'meal.html', 600);
  };

  // Enter 검색
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.searchSchool();
  });
</script>
</body>
</html>
