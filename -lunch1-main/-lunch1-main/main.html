<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>급식 플랫폼 - 홈</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--blue:#0099cc;--sb:80px;--sb-ex:220px;--bg:#eef4f8;--card:#fff;--text:#1e2a38;--muted:#7a8fa0;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;display:flex;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:#1b2b3a;display:flex;flex-direction:column;z-index:200;transition:width .26s cubic-bezier(.4,0,.2,1);overflow:hidden;box-shadow:2px 0 16px rgba(0,0,0,.18);}
    .sidebar:hover{width:var(--sb-ex);}
    .sb-top{padding:18px 0 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;}
    .hamburger{display:flex;flex-direction:column;gap:5px;}
    .hamburger span{display:block;width:26px;height:2.5px;background:rgba(255,255,255,.45);border-radius:2px;}
    .sb-all{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px;white-space:nowrap;}
    .nav{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:6px 0;}
    .nav-item{position:relative;cursor:pointer;}
    .nav-main{display:flex;align-items:center;padding:13px 0;gap:14px;transition:background .18s;position:relative;white-space:nowrap;}
    .nav-main::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;border-radius:0 2px 2px 0;}
    .nav-item.active .nav-main::before{background:var(--blue);}
    .nav-item:hover .nav-main,.nav-item.active .nav-main{background:rgba(255,255,255,.06);}
    .nav-icon-wrap{width:var(--sb);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .nav-icon{font-size:22px;line-height:1;}
    .nav-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);white-space:nowrap;transition:color .18s;}
    .nav-item.active .nav-label,.nav-item:hover .nav-label{color:rgba(255,255,255,.95);}
    .nav-sub{max-height:0;overflow:hidden;transition:max-height .22s ease;background:rgba(0,0,0,.15);}
    .sidebar:hover .nav-item:hover .nav-sub{max-height:200px;}
    .nav-sub a{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 36px;font-size:13px;color:rgba(255,255,255,.5);text-decoration:none;white-space:nowrap;transition:background .14s,color .14s;}
    .nav-sub a:hover{background:rgba(255,255,255,.07);color:#fff;}
    .sub-icon{font-size:14px;width:18px;text-align:center;}
    .sb-bottom{border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;}
    .logout-row{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;transition:background .15s;white-space:nowrap;}
    .logout-row:hover{background:rgba(255,60,60,.1);}
    .main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;}
    .greeting-bar{background:var(--card);padding:18px 32px;border-bottom:1px solid #dde8f0;box-shadow:0 1px 8px rgba(0,60,120,.05);}
    .greeting-inner{max-width:860px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
    .greeting-text{font-size:19px;font-weight:700;color:var(--text);}
    .greeting-text em{color:var(--blue);font-style:normal;}
    .role-badge{padding:5px 16px;border-radius:20px;font-size:12px;font-weight:700;}
    .role-teacher{background:#e3f2fd;color:#0077aa;}
    .role-student{background:#e0f7fa;color:#00838f;}
    .content{padding:28px 32px;flex:1;max-width:860px;width:100%;margin:0 auto;}
    .bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
    .search-box{flex:1;display:flex;align-items:center;background:var(--card);border-radius:12px;padding:10px 16px;box-shadow:0 2px 8px rgba(0,60,120,.07);gap:10px;}
    .search-box input{border:none;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);flex:1;background:transparent;}
    .search-box input::placeholder{color:#b0bec5;}
    .write-btn{padding:11px 22px;background:linear-gradient(90deg,#0099cc,#005f8a);color:white;border:none;border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 3px 14px rgba(0,153,204,.35);transition:transform .15s;text-decoration:none;display:flex;align-items:center;gap:6px;}
    .write-btn:hover{transform:translateY(-2px);}
    .posts{display:flex;flex-direction:column;gap:14px;}
    .post-card{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:0 2px 12px rgba(0,60,120,.07);cursor:pointer;transition:transform .15s,box-shadow .15s;animation:fadeUp .4s ease both;display:flex;gap:16px;align-items:flex-start;position:relative;}
    .post-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,100,180,.13);}
    .post-card.pinned{border:1.5px solid #b0dff5;background:linear-gradient(135deg,#f0fbff,#fff);}
    .pin-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#0077aa;background:#ddf0ff;padding:3px 8px;border-radius:8px;margin-bottom:5px;}
    .vote-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#2e7d32;background:#e8f5e9;padding:3px 8px;border-radius:8px;margin-bottom:5px;margin-left:4px;}
    .result-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#b45309;background:#fff8e1;padding:3px 8px;border-radius:8px;margin-bottom:5px;margin-left:4px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .post-thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;flex-shrink:0;}
    .post-thumb-placeholder{width:72px;height:72px;border-radius:10px;background:#f0f7fb;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
    .post-body{flex:1;min-width:0;}
    .post-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .post-preview{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    .post-meta{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:#b0bec5;}
    .post-author{font-weight:600;color:var(--blue);}
    .post-del-btn{position:absolute;top:14px;right:14px;padding:4px 10px;border:1.5px solid #ffcccc;border-radius:8px;background:white;color:#e53935;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;opacity:0;transition:opacity .15s;}
    .post-card:hover .post-del-btn{opacity:1;}
    .post-del-btn:hover{background:#fff0f0;}
    .empty{text-align:center;padding:60px 20px;color:var(--muted);}
    .empty .empty-icon{font-size:52px;margin-bottom:14px;}
    .empty p{font-size:15px;font-weight:500;}
    .empty small{font-size:13px;margin-top:6px;display:block;}
    .spinner{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sb-top">
    <div class="hamburger"><span></span><span></span><span></span></div>
    <span class="sb-all">전체</span>
  </div>
  <div class="nav">
    <div class="nav-item active">
      <div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏠</span></div><span class="nav-label">홈</span></div>
      <div class="nav-sub"><a href="main.html"><span class="sub-icon">📋</span>게시판</a><a href="#"><span class="sub-icon">🔔</span>알림</a></div>
    </div>
    <div class="nav-item">
      <div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🗳️</span></div><span class="nav-label">급식투표</span></div>
      <div class="nav-sub"><a href="vote.html"><span class="sub-icon">✅</span>투표하기</a><a href="vote.html"><span class="sub-icon">📈</span>결과 보기</a></div>
    </div>
    <div class="nav-item">
      <div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🍱</span></div><span class="nav-label">오늘의급식</span></div>
      <div class="nav-sub"><a href="meal.html"><span class="sub-icon">📅</span>오늘 메뉴</a></div>
    </div>
    <div class="nav-item">
      <div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">✏️</span></div><span class="nav-label">글쓰기</span></div>
      <div class="nav-sub"><a href="write.html"><span class="sub-icon">📝</span>새 글 작성</a>
    </div>
    <div class="nav-item">
      <div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏫</span></div><span class="nav-label">학교선택</span></div>
      <div class="nav-sub"><a href="school-select.html"><span class="sub-icon">🔍</span>학교 검색</a><a href="school-select.html"><span class="sub-icon">📍</span>내 학교</a></div>
    </div>
  </div>
  <div class="sb-bottom">
    <div class="logout-row" id="logoutBtn">
      <div class="nav-icon-wrap"><span class="nav-icon">🚪</span></div>
      <span class="nav-label" style="color:rgba(255,100,100,.75);">로그아웃</span>
    </div>
  </div>
</nav>

<div class="main">
  <div class="greeting-bar">
    <div class="greeting-inner">
      <div class="greeting-text"><em id="userName">OOO</em> 님 안녕하세요 👋</div>
      <span class="role-badge" id="roleBadge"></span>
    </div>
  </div>
  <div class="content">
    <div class="bar">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="게시글 검색..." oninput="filterPosts()"/>
      </div>
      <a href="write.html" class="write-btn">✏️ 글쓰기</a>
    </div>
    <div class="posts" id="postList"><div class="spinner">⏳ 게시글 불러오는 중...</div></div>
  </div>
</div>

<script type="module">
  import DB from './db.js';
  const user = DB.getSession();
  if (!user) location.href = 'index.html';

  document.getElementById('userName').textContent = user.name;
  const badge = document.getElementById('roleBadge');
  badge.textContent = user.role === 'teacher' ? '교사' : '학생';
  badge.className = 'role-badge ' + (user.role==='teacher' ? 'role-teacher' : 'role-student');
  document.getElementById('logoutBtn').onclick = () => { DB.clearSession(); location.href='index.html'; };

  let allPosts = [];
  DB.onPosts(posts => { allPosts = posts; filterPosts(); });

  window.filterPosts = function() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = q ? allPosts.filter(p =>
      p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q)
    ) : allPosts;
    renderPosts(filtered);
  };

  function renderPosts(posts) {
    const list = document.getElementById('postList');
    if (posts.length === 0) {
      const q = document.getElementById('searchInput').value.trim();
      list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>${q?'검색 결과가 없습니다.':'아직 게시글이 없습니다.'}</p><small>${q?'다른 검색어를 시도해보세요.':'첫 번째 글을 작성해보세요!'}</small></div>`;
      return;
    }
    const isTeacher = user.role === 'teacher';
    list.innerHTML = posts.map((p,i) => {
      const thumb = p.image ? `<img class="post-thumb" src="${p.image}" alt="썸네일"/>` : `<div class="post-thumb-placeholder">🍽️</div>`;
      const pinBadge = p.pinned ? `<div class="pin-badge">📌 교사 공지</div>` : '';
      const voteBadge = p.isVoteNotice ? `<span class="vote-badge">🗳️ 투표 공지</span>` : '';
      const resultBadge = p.isVoteResult ? `<span class="result-badge">📊 투표 결과</span>` : '';
      const clickTarget = p.isVoteNotice ? `vote.html` : `post.html?id=${p.id}`;
      // 교사는 모든 글 삭제 가능, 학생은 본인 글만
      const canDel = isTeacher || p.authorId === user.id;
      const delBtn = canDel
        ? `<button class="post-del-btn" onclick="event.stopPropagation();delPost('${p.id}')">🗑 삭제</button>`
        : '';
      return `<div class="post-card${p.pinned?' pinned':''}" style="animation-delay:${i*0.05}s" onclick="location.href='${clickTarget}'">
        ${thumb}
        <div class="post-body">
          <div>${pinBadge}${voteBadge}${resultBadge}</div>
          <div class="post-title">${esc(p.title)}</div>
          <div class="post-preview">${esc(p.content)}</div>
          <div class="post-meta"><span class="post-author">✍️ ${esc(p.authorName)}</span><span>·</span><span>${DB.timeAgo(p.createdAt)}</span></div>
        </div>
        ${delBtn}
      </div>`;
    }).join('');
  }

  window.delPost = async function(id) {
    if (!confirm('이 게시글을 삭제할까요?')) return;
    await DB.deletePost(id);
  };

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
