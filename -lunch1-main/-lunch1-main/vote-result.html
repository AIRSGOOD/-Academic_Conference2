<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>투표 결과 - 급식 플랫폼</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--blue:#0099cc;--sb:80px;--sb-ex:220px;--bg:#eef4f8;--card:#fff;--text:#1e2a38;--muted:#7a8fa0;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;display:flex;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:#1b2b3a;display:flex;flex-direction:column;z-index:200;transition:width .26s cubic-bezier(.4,0,.2,1);overflow:hidden;box-shadow:2px 0 16px rgba(0,0,0,.18);}
    .sidebar:hover{width:var(--sb-ex);}
    .sb-top{padding:18px 0 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;}
    .hamburger{display:flex;flex-direction:column;gap:5px;}
    .hamburger span{display:block;width:26px;height:2.5px;background:rgba(255,255,255,.45);border-radius:2px;}
    .sb-all{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px;white-space:nowrap;}
    .nav{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:6px 0;}
    .nav-item{position:relative;cursor:pointer;}
    .nav-main{display:flex;align-items:center;padding:13px 0;gap:14px;transition:background .18s;position:relative;white-space:nowrap;}
    .nav-main::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;border-radius:0 2px 2px 0;}
    .nav-item.active .nav-main::before{background:var(--blue);}
    .nav-item:hover .nav-main,.nav-item.active .nav-main{background:rgba(255,255,255,.06);}
    .nav-icon-wrap{width:var(--sb);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .nav-icon{font-size:22px;}
    .nav-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);white-space:nowrap;transition:color .18s;}
    .nav-item.active .nav-label,.nav-item:hover .nav-label{color:rgba(255,255,255,.95);}
    .nav-sub{max-height:0;overflow:hidden;transition:max-height .22s ease;background:rgba(0,0,0,.15);}
    .sidebar:hover .nav-item:hover .nav-sub{max-height:200px;}
    .nav-sub a{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 36px;font-size:13px;color:rgba(255,255,255,.5);text-decoration:none;white-space:nowrap;transition:background .14s,color .14s;}
    .nav-sub a:hover{background:rgba(255,255,255,.07);color:#fff;}
    .sub-icon{font-size:14px;width:18px;text-align:center;}
    .sb-bottom{border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;}
    .logout-row{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;transition:background .15s;white-space:nowrap;}
    .logout-row:hover{background:rgba(255,60,60,.1);}

    .main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;min-height:100vh;}

    /* 헤더 */
    .page-header{background:linear-gradient(135deg,#0099cc,#005f8a);padding:0 32px;position:relative;overflow:hidden;}
    .page-header::before{content:'';position:absolute;width:200px;height:200px;background:rgba(255,255,255,.08);border-radius:50%;top:-60px;right:-40px;}
    .header-inner{max-width:700px;width:100%;margin:0 auto;padding:24px 0 32px;position:relative;z-index:1;}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);font-size:13px;text-decoration:none;margin-bottom:14px;transition:color .15s;}
    .back-link:hover{color:white;}
    .header-inner h1{font-size:20px;font-weight:900;color:white;margin-bottom:6px;line-height:1.4;}
    .header-meta{font-size:13px;color:rgba(255,255,255,.8);}
    .header-date{font-size:13px;font-weight:700;color:#ffe082;margin-top:3px;}
    .status-chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;margin-top:8px;}
    .chip-open{background:rgba(255,255,255,.25);color:white;}
    .chip-closed{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);}

    .content{padding:24px 32px;flex:1;max-width:700px;width:100%;margin:0 auto;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    /* 요약 카드 */
    .summary-card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 2px 16px rgba(0,60,120,.08);margin-bottom:20px;animation:fadeUp .4s ease both;display:flex;gap:20px;}
    .summary-item{flex:1;text-align:center;}
    .summary-num{font-size:32px;font-weight:900;color:var(--blue);}
    .summary-label{font-size:12px;color:var(--muted);margin-top:4px;}
    .summary-divider{width:1px;background:#eef3f8;}

    /* 1위 하이라이트 */
    .winner-card{background:linear-gradient(135deg,#fff8e1,#fffde7);border:2px solid #ffd740;border-radius:18px;padding:24px;box-shadow:0 4px 20px rgba(255,193,7,.2);margin-bottom:20px;animation:fadeUp .4s ease both .05s;text-align:center;}
    .winner-emoji{font-size:44px;margin-bottom:8px;}
    .winner-label{font-size:13px;font-weight:700;color:#f57f17;margin-bottom:6px;}
    .winner-name{font-size:24px;font-weight:900;color:#5d4037;}
    .winner-votes{font-size:14px;color:#795548;margin-top:6px;}

    /* 순위 리스트 */
    .rank-section-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
    .rank-section-title::before{content:'';width:3px;height:16px;background:var(--blue);border-radius:2px;}
    .rank-list{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}

    .rank-item{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:0 2px 10px rgba(0,60,120,.07);display:flex;align-items:center;gap:16px;animation:fadeUp .4s ease both;}
    .rank-item.rank-1{border-left:4px solid #ffd740;}
    .rank-item.rank-2{border-left:4px solid #b0bec5;}
    .rank-item.rank-3{border-left:4px solid #ff8a65;}
    .rank-num{font-size:22px;font-weight:900;width:36px;text-align:center;flex-shrink:0;}
    .rank-1 .rank-num{color:#f9a825;}
    .rank-2 .rank-num{color:#78909c;}
    .rank-3 .rank-num{color:#ff7043;}
    .rank-info{flex:1;}
    .rank-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;}
    .rank-bar-bg{height:10px;background:#eef3f8;border-radius:6px;overflow:hidden;margin-bottom:4px;}
    .rank-bar-fill{height:100%;border-radius:6px;transition:width .8s ease;}
    .rank-1 .rank-bar-fill{background:linear-gradient(90deg,#f9a825,#ffd54f);}
    .rank-2 .rank-bar-fill{background:linear-gradient(90deg,#78909c,#b0bec5);}
    .rank-3 .rank-bar-fill{background:linear-gradient(90deg,#ff7043,#ff8a65);}
    .rank-other .rank-bar-fill{background:linear-gradient(90deg,#0099cc,#5cc8e0);}
    .rank-vote-info{font-size:12px;color:var(--muted);}
    .rank-votes-num{font-size:16px;font-weight:700;color:var(--text);flex-shrink:0;}

    /* 기타 의견 */
    .etc-section{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,60,120,.07);margin-bottom:20px;animation:fadeUp .4s ease both;}
    .etc-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;}
    .etc-chip{display:inline-block;padding:5px 12px;background:#f0f7fb;border-radius:20px;font-size:13px;color:var(--text);margin:3px;}

    .spinner{text-align:center;padding:50px;color:var(--muted);}
    .empty{text-align:center;padding:60px;color:var(--muted);}
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sb-top"><div class="hamburger"><span></span><span></span><span></span></div><span class="sb-all">전체</span></div>
  <div class="nav">
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏠</span></div><span class="nav-label">홈</span></div><div class="nav-sub"><a href="main.html"><span class="sub-icon">📋</span>게시판</a></div></div>
    <div class="nav-item active"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🗳️</span></div><span class="nav-label">급식투표</span></div><div class="nav-sub"><a href="vote.html"><span class="sub-icon">✅</span>투표하기</a><a href="vote-result.html"><span class="sub-icon">📈</span>결과 보기</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🍱</span></div><span class="nav-label">오늘의급식</span></div><div class="nav-sub"><a href="meal.html"><span class="sub-icon">📅</span>오늘 메뉴</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">✏️</span></div><span class="nav-label">글쓰기</span></div><div class="nav-sub"><a href="write.html"><span class="sub-icon">📝</span>새 글 작성</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏫</span></div><span class="nav-label">학교선택</span></div><div class="nav-sub"><a href="school-select.html"><span class="sub-icon">🔍</span>학교 검색</a></div></div>
  </div>
  <div class="sb-bottom"><div class="logout-row" id="logoutBtn"><div class="nav-icon-wrap"><span class="nav-icon">🚪</span></div><span class="nav-label" style="color:rgba(255,100,100,.75);">로그아웃</span></div></div>
</nav>

<div class="main">
  <div class="page-header">
    <div class="header-inner">
      <a href="vote.html" class="back-link">← 투표 목록으로</a>
      <div id="headerArea"><div class="spinner">로딩 중...</div></div>
    </div>
  </div>
  <div class="content" id="resultContent">
    <div class="spinner">⏳ 결과 불러오는 중...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import DB from './db.js';

  const cfg = {
    apiKey:"AIzaSyAvNwIF9BXFY5Clkf9SDZbK79GGvds199E",
    authDomain:"school-21d4a.firebaseapp.com",
    databaseURL:"https://school-21d4a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"school-21d4a",
    storageBucket:"school-21d4a.firebasestorage.app",
    messagingSenderId:"95581019938",
    appId:"1:95581019938:web:7e28da6c84744aeba14f7b"
  };
  const fapp = initializeApp(cfg);
  const fdb  = getDatabase(fapp);

  const user = DB.getSession();
  if (!user) location.href = 'index.html';
  document.getElementById('logoutBtn').onclick = () => { DB.clearSession(); location.href='index.html'; };

  // URL에서 voteId 파싱
  const params = new URLSearchParams(location.search);
  const voteId = params.get('id');

  if (!voteId) {
    // id 없으면 가장 최근 종료 투표 목록 표시
    showAllResults();
  } else {
    // 특정 투표 결과 표시
    onValue(ref(fdb, `votes/${voteId}`), snap => {
      if (!snap.exists()) {
        document.getElementById('resultContent').innerHTML = '<div class="empty">투표를 찾을 수 없습니다.</div>';
        return;
      }
      renderResult(snap.val());
    });
  }

  function showAllResults() {
    document.getElementById('headerArea').innerHTML = `<h1>📊 투표 결과</h1><div class="header-meta">종료된 투표 결과를 확인하세요</div>`;
    onValue(ref(fdb, 'votes'), snap => {
      if (!snap.exists()) {
        document.getElementById('resultContent').innerHTML = '<div class="empty">결과가 없습니다.</div>';
        return;
      }
      const closed = Object.values(snap.val())
        .filter(v => v.status === 'closed')
        .sort((a,b) => b.createdAt - a.createdAt);
      if (closed.length === 0) {
        document.getElementById('resultContent').innerHTML = '<div class="empty">종료된 투표가 없습니다.</div>';
        return;
      }
      // 가장 최근 종료 투표 결과 표시
      renderResult(closed[0]);
    });
  }

  function renderResult(v) {
    const voters  = v.voters || {};
    const total   = Object.keys(voters).length;
    const options = v.options || [];
    const isOpen  = v.status === 'open';

    // 헤더
    document.getElementById('headerArea').innerHTML = `
      <h1>${esc(v.question)}</h1>
      <div class="header-meta">작성자: ${esc(v.createdBy)} · ${DB.timeAgo(v.createdAt)}</div>
      <div class="header-date">📅 대상 날짜: ${v.targetDate}</div>
      <div class="status-chip ${isOpen?'chip-open':'chip-closed'}">${isOpen?'진행 중':'종료됨'}</div>
    `;

    // 득표수 계산
    const counts = options.map((_, i) =>
      Object.values(voters).filter(val =>
        options[i].isEtc
          ? (typeof val==='string' && val.startsWith('etc:'))
          : val === i
      ).length
    );

    // 순위 정렬
    const ranked = options
      .map((opt, i) => ({ opt, count: counts[i], origIdx: i }))
      .sort((a,b) => b.count - a.count);

    const winner = ranked[0];
    const maxCount = winner?.count || 1;

    // 기타 텍스트 모음
    const etcTexts = Object.values(voters)
      .filter(v => typeof v==='string' && v.startsWith('etc:'))
      .map(v => v.replace('etc:',''))
      .filter(Boolean);

    // 요약 카드
    const summaryHTML = `
      <div class="summary-card">
        <div class="summary-item">
          <div class="summary-num">${total}</div>
          <div class="summary-label">총 참여자</div>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-item">
          <div class="summary-num">${options.length}</div>
          <div class="summary-label">선택지 수</div>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-item">
          <div class="summary-num">${winner?.count || 0}</div>
          <div class="summary-label">최다 득표</div>
        </div>
      </div>`;

    // 1위 하이라이트
    const winnerHTML = winner ? `
      <div class="winner-card">
        <div class="winner-emoji">🏆</div>
        <div class="winner-label">1위</div>
        <div class="winner-name">${esc(winner.opt.isEtc ? '기타' : winner.opt.label)}</div>
        <div class="winner-votes">${winner.count}표 (${total>0?Math.round(winner.count/total*100):0}%)</div>
      </div>` : '';

    // 순위 리스트
    const rankEmoji = ['🥇','🥈','🥉'];
    const rankClass = ['rank-1','rank-2','rank-3','rank-other'];
    const rankListHTML = `
      <div class="rank-section-title">투표 결과</div>
      <div class="rank-list">
        ${ranked.map((item, ri) => {
          const pct = total>0 ? Math.round(item.count/total*100) : 0;
          const rc  = rankClass[Math.min(ri, 3)];
          const label = item.opt.isEtc ? '기타' : item.opt.label;
          return `<div class="rank-item ${rc}" style="animation-delay:${ri*0.06}s">
            <div class="rank-num">${rankEmoji[ri] || (ri+1)+'위'}</div>
            <div class="rank-info">
              <div class="rank-name">${esc(label)}</div>
              <div class="rank-bar-bg">
                <div class="rank-bar-fill" style="width:${maxCount>0?Math.round(item.count/maxCount*100):0}%"></div>
              </div>
              <div class="rank-vote-info">${pct}%</div>
            </div>
            <div class="rank-votes-num">${item.count}표</div>
          </div>`;
        }).join('')}
      </div>`;

    // 기타 의견 섹션
    const etcHTML = etcTexts.length > 0 ? `
      <div class="etc-section">
        <div class="etc-title">💬 기타 의견 (${etcTexts.length}개)</div>
        ${etcTexts.map(t => `<span class="etc-chip">${esc(t)}</span>`).join('')}
      </div>` : '';

    document.getElementById('resultContent').innerHTML = summaryHTML + winnerHTML + rankListHTML + etcHTML;
  }

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
