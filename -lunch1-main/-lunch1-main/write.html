<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>글쓰기 - 급식 플랫폼</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--blue:#0099cc;--sb:80px;--sb-ex:220px;--bg:#eef4f8;--card:#fff;--text:#1e2a38;--muted:#7a8fa0;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;display:flex;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:#1b2b3a;display:flex;flex-direction:column;z-index:200;transition:width .26s cubic-bezier(.4,0,.2,1);overflow:hidden;box-shadow:2px 0 16px rgba(0,0,0,.18);}
    .sidebar:hover{width:var(--sb-ex);}
    .sb-top{padding:18px 0 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;}
    .hamburger{display:flex;flex-direction:column;gap:5px;}
    .hamburger span{display:block;width:26px;height:2.5px;background:rgba(255,255,255,.45);border-radius:2px;}
    .sb-all{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px;white-space:nowrap;}
    .nav{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:6px 0;}
    .nav-item{position:relative;cursor:pointer;}
    .nav-main{display:flex;align-items:center;padding:13px 0;gap:14px;transition:background .18s;position:relative;white-space:nowrap;}
    .nav-main::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;border-radius:0 2px 2px 0;}
    .nav-item.active .nav-main::before{background:var(--blue);}
    .nav-item:hover .nav-main,.nav-item.active .nav-main{background:rgba(255,255,255,.06);}
    .nav-icon-wrap{width:var(--sb);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .nav-icon{font-size:22px;line-height:1;}
    .nav-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);white-space:nowrap;transition:color .18s;}
    .nav-item.active .nav-label,.nav-item:hover .nav-label{color:rgba(255,255,255,.95);}
    .nav-sub{max-height:0;overflow:hidden;transition:max-height .22s ease;background:rgba(0,0,0,.15);}
    .sidebar:hover .nav-item:hover .nav-sub{max-height:200px;}
    .nav-sub a{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 36px;font-size:13px;color:rgba(255,255,255,.5);text-decoration:none;white-space:nowrap;transition:background .14s,color .14s;}
    .nav-sub a:hover{background:rgba(255,255,255,.07);color:#fff;}
    .sub-icon{font-size:14px;width:18px;text-align:center;}
    .sb-bottom{border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;}
    .logout-row{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;transition:background .15s;white-space:nowrap;}
    .logout-row:hover{background:rgba(255,60,60,.1);}
    .main{margin-left:var(--sb);flex:1;display:flex;flex-direction:column;}
    .page-tab{padding:18px 28px;font-size:15px;font-weight:700;color:var(--muted);text-decoration:none;display:block;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;}
    .page-tab.active{color:var(--blue);border-bottom-color:var(--blue);}
    .page-tab:hover{color:var(--blue);}
    .content{padding:28px 32px;flex:1;max-width:780px;width:100%;margin:0 auto;}
    .page-header{background:var(--card);border-bottom:1px solid #dde8f0;box-shadow:0 1px 8px rgba(0,60,120,.05);}
    .page-header-inner{max-width:780px;width:100%;margin:0 auto;display:flex;align-items:center;}
    .write-card{background:var(--card);border-radius:18px;box-shadow:0 2px 16px rgba(0,60,120,.08);overflow:hidden;animation:fadeUp .4s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .title-area{padding:20px 24px;border-bottom:1px solid #eef3f8;display:flex;align-items:center;gap:12px;}
    .title-label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}
    .title-input{flex:1;border:none;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:700;color:var(--text);background:transparent;}
    .title-input::placeholder{color:#c5d5df;font-weight:400;}
    .content-area{padding:20px 24px;border-bottom:1px solid #eef3f8;}
    .content-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;}
    .content-input{width:100%;min-height:240px;border:none;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);background:transparent;resize:none;line-height:1.7;}
    .content-input::placeholder{color:#c5d5df;}
    .image-area{padding:16px 24px;border-bottom:1px solid #eef3f8;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .upload-btn{display:flex;align-items:center;gap:8px;padding:9px 18px;border:2px dashed #b0d4e8;border-radius:10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;color:var(--blue);background:#f5fbff;transition:border-color .15s;}
    .upload-btn:hover{border-color:var(--blue);}
    #fileInput{display:none;}
    .preview-wrap{position:relative;}
    .preview-img{width:80px;height:80px;border-radius:10px;object-fit:cover;display:none;border:2px solid #d0e8f4;}
    .remove-img{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:#ff5555;border:none;border-radius:50%;cursor:pointer;color:white;font-size:12px;display:none;align-items:center;justify-content:center;font-weight:700;}
    .action-bar{padding:16px 24px;display:flex;justify-content:flex-end;gap:10px;background:#f8fbff;}
    .btn-cancel{padding:11px 22px;border:1.5px solid #d0dde8;border-radius:10px;background:white;color:var(--muted);font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
    .btn-cancel:hover{background:#f0f5f8;}
    .btn-submit{padding:11px 28px;background:linear-gradient(90deg,#0099cc,#005f8a);color:white;border:none;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 14px rgba(0,153,204,.3);transition:transform .15s;}
    .btn-submit:hover{transform:translateY(-2px);}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .error-msg{color:#e53935;font-size:13px;padding:0 24px 12px;display:none;}
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sb-top"><div class="hamburger"><span></span><span></span><span></span></div><span class="sb-all">전체</span></div>
  <div class="nav">
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏠</span></div><span class="nav-label">홈</span></div><div class="nav-sub"><a href="main.html"><span class="sub-icon">📋</span>게시판</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🗳️</span></div><span class="nav-label">급식투표</span></div><div class="nav-sub"><a href="#"><span class="sub-icon">✅</span>투표하기</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🍱</span></div><span class="nav-label">오늘의급식</span></div><div class="nav-sub"><a href="#"><span class="sub-icon">📅</span>오늘 메뉴</a></div></div>
    <div class="nav-item active"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">✏️</span></div><span class="nav-label">글쓰기</span></div><div class="nav-sub"><a href="write.html"><span class="sub-icon">📝</span>새 글 작성</a></div></div>
    <div class="nav-item"><div class="nav-main"><div class="nav-icon-wrap"><span class="nav-icon">🏫</span></div><span class="nav-label">학교선택</span></div><div class="nav-sub"><a href="#"><span class="sub-icon">🔍</span>학교 검색</a></div></div>
  </div>
  <div class="sb-bottom"><div class="logout-row" id="logoutBtn"><div class="nav-icon-wrap"><span class="nav-icon">🚪</span></div><span class="nav-label" style="color:rgba(255,100,100,.75);">로그아웃</span></div></div>
</nav>
<div class="main">
  <div class="page-header">
    <div class="page-header-inner">
      <a href="main.html" class="page-tab">홈</a>
      <span class="page-tab active">글쓰기 ✏️</span>
    </div>
  </div>
  <div class="content">
    <div class="write-card">
      <div class="title-area">
        <span class="title-label">제목</span>
        <input class="title-input" type="text" id="titleInput" placeholder="제목을 입력하세요" maxlength="100"/>
      </div>
      <div class="content-area">
        <div class="content-label">내용작성</div>
        <textarea class="content-input" id="contentInput" placeholder="내용을 입력하세요..."></textarea>
      </div>
      <div class="image-area">
        <label class="upload-btn" for="fileInput">📷 사진 업로드</label>
        <input type="file" id="fileInput" accept="image/*"/>
        <div class="preview-wrap">
          <img class="preview-img" id="previewImg" src="" alt="미리보기"/>
          <button class="remove-img" id="removeBtn">✕</button>
        </div>
      </div>
      <div class="error-msg" id="errMsg"></div>
      <div class="action-bar">
        <button class="btn-cancel" onclick="location.href='main.html'">취소</button>
        <button class="btn-submit" id="submitBtn">등록하기</button>
      </div>
    </div>
  </div>
</div>
<script type="module">
  import DB from './db.js';
  const user = DB.getSession();
  if (!user) location.href = 'index.html';
  document.getElementById('logoutBtn').onclick = () => { DB.clearSession(); location.href='index.html'; };

  let imageData = null;

  document.getElementById('fileInput').addEventListener('change', function() {
    const file = this.files[0]; if (!file) return;
    if (file.size > 5*1024*1024) { showErr('이미지는 5MB 이하만 가능합니다.'); this.value=''; return; }
    const reader = new FileReader();
    reader.onload = e => {
      imageData = e.target.result;
      const img = document.getElementById('previewImg');
      const btn = document.getElementById('removeBtn');
      img.src = imageData; img.style.display='block'; btn.style.display='flex';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('removeBtn').onclick = () => {
    imageData = null;
    document.getElementById('previewImg').style.display='none';
    document.getElementById('removeBtn').style.display='none';
    document.getElementById('fileInput').value='';
  };

  document.getElementById('submitBtn').onclick = async () => {
    const title   = document.getElementById('titleInput').value.trim();
    const content = document.getElementById('contentInput').value.trim();
    if (!title)   { showErr('제목을 입력하세요.'); return; }
    if (!content) { showErr('내용을 입력하세요.'); return; }
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').textContent = '등록 중...';
    await DB.addPost({ title, content, image: imageData, authorId: user.id, authorName: user.name, authorRole: user.role });
    location.href = 'main.html';
  };

  function showErr(msg) {
    const e = document.getElementById('errMsg');
    e.textContent = msg; e.style.display='block';
    setTimeout(()=>e.style.display='none', 3000);
  }
</script>
</body>
</html>
